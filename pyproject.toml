[project]
name = "meritorder"
version = "0.0.1"
description = "LLM gateway that dispatches every session to the cheapest capacity that meets its quality bar."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "The Merit Order Authors" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "redis>=5.0",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.9",
    "botocore>=1.35",
    "websockets>=15",
    "python-multipart>=0.0.20",
]

[project.urls]
Homepage = "https://github.com/therick/meritorder"
Source = "https://github.com/therick/meritorder"
Issues = "https://github.com/therick/meritorder/issues"

[project.optional-dependencies]
gcp = ["google-auth>=2.30", "requests>=2.32"]
azure = ["azure-identity>=1.17"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
parquet = ["pyarrow>=18"]  # `meritorder export --format parquet`
# The controller follows vLLM's KV-cache events (ZeroMQ, msgpack) for deployments with serve.kv_events.
kv-events = ["pyzmq>=26", "msgpack>=1.1"]
# `meritorder compressor`: LLMLingua-2 for model-based compression of tool results. Brings torch and transformers
# (torch from PyPI runs on CPU, and on NVIDIA GPUs on Linux), so it's in its own image, never the default one.
compressor = ["llmlingua==0.2.2"]

[project.scripts]
meritorder = "meritorder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "opentelemetry-sdk>=1.30",
    "pyarrow>=18",
    "pytest-cov>=6.0",
    # The KV-event subscriber is tested against a real ZeroMQ socket on localhost.
    "pyzmq>=26",
    "msgpack>=1.1",
    "openai>=3.42.1",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meritorder"]
# The reporting UI is a build output (git-ignored); ship it when it has been built.
artifacts = ["src/meritorder/ui_dist/**"]

[tool.uv]
# Supply-chain policy: never resolve a release published in the last few days.
# Bump this date deliberately (Renovate will do it with a waiting period).
exclude-newer = "2026-11-02T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["meritorder"]
# Eval tasks' own code (reference solutions, hidden tests, fixture projects) runs in a sandbox, not in-process.
omit = ["*/ui_dist/*", "*/evals/suites/*", "*/evals/envs/fixtures/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
