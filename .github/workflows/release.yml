name: release
on:
  push: {tags: ["v*"]}
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image   # ghcr names are lowercase; github.repository keeps the owner's case (therick/meritorder)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=semver,pattern={{version}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - id: meta-gpu
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=semver,pattern={{version}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-only
          flavor: suffix=-gpu,onlatest=true    # latest-gpu, not a plain latest over the main image's
      - id: build-gpu   # the capacity controller's image: adds SkyPilot in its own environment
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SKYPILOT=0.14.2
          tags: ${{ steps.meta-gpu.outputs.tags }}
          labels: ${{ steps.meta-gpu.outputs.labels }}
          sbom: true
          provenance: mode=max
      - id: meta-compressor
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=semver,pattern={{version}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-only
          flavor: suffix=-compressor,onlatest=true    # latest-compressor, likewise
      - id: build-compressor   # `meritorder compressor` for model-based compression: llmlingua and torch, no SkyPilot
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EXTRAS=--extra otel --extra compressor
            SKYPILOT=
          tags: ${{ steps.meta-compressor.outputs.tags }}
          labels: ${{ steps.meta-compressor.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1
      - name: Sign the images
        run: |
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build-gpu.outputs.digest }}"
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build-compressor.outputs.digest }}"
      # What users run (docs/07-deployment.md#verifying-an-image): each signature, from this workflow on a v* tag, and each
      # image's SBOM and provenance attached. A release whose images don't verify fails here.
      - name: Verify the signatures and attestations
        env:
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for digest in "${{ steps.build.outputs.digest }}" "${{ steps.build-gpu.outputs.digest }}" "${{ steps.build-compressor.outputs.digest }}"; do
            ref="${{ steps.image.outputs.name }}@$digest"
            cosign verify --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' | grep -q '"SPDX' || { echo "no SBOM on $ref"; exit 1; }
            docker buildx imagetools inspect "$ref" --format '{{ json .Provenance }}' | grep -q 'SLSA' || { echo "no provenance on $ref"; exit 1; }
            echo "verified $ref"
          done
